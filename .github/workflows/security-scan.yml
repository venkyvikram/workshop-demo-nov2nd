name: Security Scan — DevSecOps Pipeline

on:
  push:
    branches: ["main", "demo-bad-commit"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Stage 1: Secret Detection ─────────────────────────────────────────────
  secret-scan:
    name: "🔍 Secret Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Stage 2: Dependency Vulnerability Scan (SCA) ─────────────────────────
  sca-scan:
    name: "📦 Dependency Scan (Trivy SCA)"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine package.json path
        id: pkg
        run: |
          # On demo-bad-commit branch scan bad-commit/, on main scan good-commit/
          if [ -f "bad-commit/package.json" ]; then
            echo "dir=bad-commit" >> $GITHUB_OUTPUT
          else
            echo "dir=good-commit" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: |
          cd ${{ steps.pkg.outputs.dir }}
          npm install --package-lock-only 2>/dev/null || true

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: "${{ steps.pkg.outputs.dir }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          format: "table"

  # ── Stage 3: Static Analysis (SAST) ──────────────────────────────────────
  sast-scan:
    name: "🛡️ SAST Scan (Semgrep)"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/owasp-top-ten
            p/secrets

  # ── Stage 4: Build (only runs if all scans pass) ──────────────────────────
  build:
    name: "🏗️ Build — Artifact"
    runs-on: ubuntu-latest
    needs: [secret-scan, sca-scan, sast-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd good-commit
          npm install

      - name: Build complete
        run: echo "✅ All security gates passed — artifact ready to deploy"
